<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>모델 검증 · jwlee 로또 연구소</title>
    <link rel="stylesheet" href="/css/lotto-sheet.css" th:href="@{/css/lotto-sheet.css}">
    <link rel="stylesheet" href="/css/sidebar.css" th:href="@{/css/sidebar.css}">
    <script defer src="/js/sidebar.js" th:src="@{/js/sidebar.js}"></script>
    <script defer src="/js/lotto-sheet.js" th:src="@{/js/lotto-sheet.js}"></script>
    <script defer src="/js/validation.js" th:src="@{/js/validation.js}"></script>
</head>
<body>
<th:block th:replace="~{fragments/navigation :: sidebar('validation')}"></th:block>
<div class="app-content">
<main id="main-content" tabindex="-1">
<header><span class="eyebrow">jwlee 로또 연구소</span><h1>모델 검증</h1><p>과거 회차에서 실제 번호와 모델의 예측을 비교합니다.</p></header>
    <section class="experiment-panel" aria-labelledby="experiment-title">
        <h2 id="experiment-title">시간순 검증</h2>
        <p>최근 최대 300회차로 학습합니다. 번호 특징에 최근 10회차의 선 길이·꺾임·위치 분포를 추가해 비교합니다.</p>
        <p>패턴 유사도와 번호 적중은 별개이며, 이 실험은 당첨 예측력을 입증하지 않습니다.</p>
        <form id="experiment-form" th:attr="data-url=@{/api/lotto/pattern/experiment}" data-url="/api/lotto/pattern/experiment">
            <label for="test-draws">검증 회차 수</label>
            <select id="test-draws"><option value="5">5회차</option><option value="10">10회차</option><option value="20">20회차</option></select>
            <button id="experiment-button" type="submit">실험 실행</button>
        </form>
        <p id="experiment-status" role="status" aria-live="polite"></p>
        <div id="experiment-summary"></div>
        <div id="experiment-results" class="sheets"></div>
    </section>
</main>
</div>
</body>
</html>
