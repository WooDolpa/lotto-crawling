spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  datasource:
    hikari:
      jdbc-url: jdbc:mariadb://${MARIADB_URL:localhost:3306}/lotto
      username: ${MARIADB_USERNAME:root}
      password: ${MARIADB_PASSWORD:}
      driver-class-name: org.mariadb.jdbc.Driver
      minimum-idle: 5
      idle-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
