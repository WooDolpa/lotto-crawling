spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  datasource:
    hikari:
      jdbc-url: jdbc:mariadb://${MARIADB_URL}
      username: ${MARIADB_USERNAME}
      password: ${MARIADB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      minimum-idle: 5
      idle-timeout: 60000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB