spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  datasource:
    url: jdbc:mariadb://${MARIADB_URL:localhost:3306}/lotto
    username: ${MARIADB_USERNAME:root}
    password: ${MARIADB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      minimum-idle: 5
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false


lotto:
  pattern:
    model-file: ${LOTTO_PATTERN_MODEL_FILE:models/lotto-pattern.bin}
  model:
    # 두 예측 모델의 이력 변경 점검 주기 (시작 시·등록 후에도 점검)
    check-interval-ms: 3600000

logging:
  file:
    name: ${HOME_DIR}/logs/lotto.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) [%thread] %class{0}.%method:%line - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %class{0}.%method:%line - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: ${HOME_DIR}/logs/lotto.%d{yyyy-MM-dd}.%i.log.gz
  level:
    root: info
    com.manage.lotto: info
